```yaml
name: Frontend CI/CD

on:
  push:
    branches:
      - aphsmsp-stg

  pull_request:
    branches:
      - aphsmsp-stg

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-stg-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Run tests only if package.json defines a test script.
      - name: Tests
        run: |
          if npm run | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
            npm run test
          else
            echo "No test script found; skipping tests."
          fi

  build-and-push:
    name: Build and publish frontend image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Define image name
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/legacy-nightmare/sms-frontend" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:stg
            ${{ steps.meta.outputs.image }}:stg-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend to EC2
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    environment: staging

    permissions:
      contents: read

    steps:
      - name: Deploy frontend container
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.STG_GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.STG_GHCR_USERNAME }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.STG_EC2_HOST }}
          username: ${{ secrets.STG_EC2_SSH_USER }}
          key: ${{ secrets.STG_EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE
          script: |
            set -eu
            cd /opt/sms

            test -n "$GHCR_TOKEN"
            test -n "$GHCR_USERNAME"
            test -n "$IMAGE"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            export FRONTEND_IMAGE="$IMAGE:stg"

            docker compose config --quiet
            docker compose pull frontend
            docker compose up -d --no-deps --wait frontend

            docker compose ps frontend
            docker compose logs --tail=50 frontend
```
