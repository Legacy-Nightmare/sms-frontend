name: Frontend CI/CD

on:
  push:
    branches: [aphsmsp-stg]
  pull_request:
    branches: [aphsmsp-stg]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Plain `npm ci` hits a real npm/arborist peer-dependency resolution
      # bug with this project's bleeding-edge deps (React 19, Vite 8, vitest
      # 4) — see CLAUDE.md. --legacy-peer-deps works around it cleanly.
      - run: npm ci --legacy-peer-deps

      # Pre-existing formatting debt (~190 prettier/eslint findings, not
      # correctness bugs) predates this pipeline — reported but not
      # blocking until someone does a dedicated cleanup pass.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm run test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:stg
            ${{ steps.image.outputs.name }}:stg-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Assumes /opt/sms on the EC2 host already has docker-compose.yml +
      # nginx.conf — the backend repo's deploy job owns syncing those (it has
      # to, for Postgres/env). On a brand-new host, deploy the backend repo's
      # aphsmsp-stg branch at least once before the first frontend deploy.
      - name: Deploy frontend container
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        with:
          host: ${{ secrets.STG_EC2_HOST }}
          username: ${{ secrets.STG_EC2_SSH_USER }}
          key: ${{ secrets.STG_EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE
          script: |
            set -e
            cd /opt/sms
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export FRONTEND_IMAGE="$IMAGE:stg"
            docker compose pull frontend
            docker compose up -d --wait frontend
            docker compose up -d nginx
            docker image prune -f
